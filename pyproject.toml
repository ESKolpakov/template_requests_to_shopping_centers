[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uktc-letters"
version = "0.1.0"
description = "Формирование писем «Об оказании содействия» в УК торговых центров"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pymorphy3>=2.0.0",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "pdfplumber>=0.11.0",
]

[project.scripts]
uktc-letters = "uktc_letters.main:main"

[tool.setuptools.packages.find]
where = ["src"]
