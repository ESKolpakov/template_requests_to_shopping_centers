name: Сборка Windows .exe

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Собрать .exe (PyInstaller)
        run: pyinstaller scripts/build_exe.spec

      - name: Упаковать в архив
        run: Compress-Archive -Path dist/UKTCLetters/* -DestinationPath UKTCLetters-windows.zip

      - name: Загрузить артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: UKTCLetters-windows
          path: UKTCLetters-windows.zip
          retention-days: 30

      - name: Создать GitHub Release (только при пуше тега)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: UKTCLetters-windows.zip
